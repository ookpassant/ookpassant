    <path d="M500 414 C 516 434, 544 434, 554 416" fill="none"/>

    <!-- eyes -->
    <circle cx="424" cy="286" r="25" fill="#1a1a1a" stroke="none"/>
    <circle cx="576" cy="286" r="25" fill="#1a1a1a" stroke="none"/>
    <circle cx="433" cy="277" r="8" fill="#ffffff" stroke="none"/>
    <circle cx="585" cy="277" r="8" fill="#ffffff" stroke="none"/>

