<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · shop · chelsea hopkins</title>
<meta name="description" content="{{summary}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="product">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{summary}}">
<meta property="og:url" content="{{url}}">
<meta property="og:locale" content="en_GB">
{{ogimage}}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-40 -40 80 80'%3E%3Cpath d='M0,-34 C3,-12 12,-3 34,0 C12,3 3,12 0,34 C-3,12 -12,3 -34,0 C-12,-3 -3,-12 0,-34 Z' fill='%23c9962e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/style.css">
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="note-page shop-page">

<header class="note-head">
  <a class="crumb" href="/">← chelsea hopkins</a>
  <a class="crumb" href="/shop/">shop</a>
</header>

<main class="note-main shop-main">
  {{notice}}
  <article class="item-page{{sold}}">
    <div class="item-page-photos">
{{photos}}
    </div>
    <div class="item-page-text">
      <p class="eyebrow">{{category}}</p>
      <h1>{{title}}</h1>
      <p class="item-page-price"><span>{{price}}</span><small>+ £2 uk postage</small></p>
      <div class="note-body">{{about}}</div>
      {{buy}}
      <p class="item-page-more"><a href="/shop/{{shelf}}">← more {{category}}</a></p>
    </div>
  </article>
</main>

<footer class="colophon">
  <p>chelsea hopkins</p>
  <p><a href="/shop/">back to the shop</a></p>
</footer>

<script src="/main.js" defer></script>
</body>
</html>
