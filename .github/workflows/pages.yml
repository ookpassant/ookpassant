# builds the site (renders notes/*.md and notes/*.enc) and deploys it to github
# pages. pages source must be set to "github actions" in the repo settings.
#
# the build also rewrites the field notes block in README.md, so this workflow
# commits that back when — and only when — it actually changed. the commit
# carries [skip ci] so it does not trigger another run of this workflow.

name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.js

      - name: sync the readme's notes block
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- README.md; then
            echo "readme notes block already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Sync recent field notes into the readme [skip ci]"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
