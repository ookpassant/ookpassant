name: mind the clock

# The README is a snapshot, but the glue factory runs on a clock. Without this
# a horse's "11 days left" would sit there until the next push, and one that
# had already gone to glue would still look adoptable.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-data
  cancel-in-progress: false

jobs:
  retally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node .github/scripts/render-readme.js

      - name: commit if anything moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md
          if git diff --cached --quiet; then
            echo "nothing moved"
            exit 0
          fi
          git commit -m "the clock moved"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
