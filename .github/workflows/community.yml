name: paddock and log book

# Nothing here runs until Chelsea puts the "approved" label on an issue.
# That label is the whole moderation system: no label, no publish.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: community-data
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install sharp
        run: npm i --no-save sharp

      - name: process the issue
        id: process
        # The issue body is untrusted. It goes in through env, never through
        # shell interpolation, and the script strips it further from there.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          OUTCOME_PATH: ${{ runner.temp }}/outcome.md
        run: node .github/scripts/process-issue.js

      - name: render the readme
        if: steps.process.outputs.ok == 'true'
        run: node .github/scripts/render-readme.js

      - name: commit
        if: steps.process.outputs.ok == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md data paddock
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "community: publish #${ISSUE_NUMBER}"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - name: reply
        if: always() && steps.process.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUTCOME_PATH: ${{ runner.temp }}/outcome.md
        run: |
          if [ ! -f "$OUTCOME_PATH" ]; then
            printf 'something went wrong on my end handling this one. i will look at it myself.\n' > "$OUTCOME_PATH"
          fi
          printf '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' >> "$OUTCOME_PATH"
          gh issue comment "$ISSUE_NUMBER" --body-file "$OUTCOME_PATH"

      - name: close it
        if: steps.process.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed
