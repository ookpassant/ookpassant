name: "🐕 adopt a dog from the pound"
description: colour in the base dog, give them a name, and they go on my profile.
title: "[pound] "
labels: ["pound"]
body:
  - type: markdown
    attributes:
      value: |
        **how this works.** download [the base](https://raw.githubusercontent.com/ookpassant/ookpassant/main/pound/base.png),
        colour it in however you like — any tool, any style, markers and a scanner if you want —
        then bring it back here.

        i look at every one before it goes up. nothing appears on my profile until i've seen it,
        so give me a day or two.

  - type: input
    id: name
    attributes:
      label: dog name
      description: what are they called? letters, numbers and basic punctuation only.
      placeholder: barnaby
    validations:
      required: true

  - type: textarea
    id: image
    attributes:
      label: your coloured-in dog
      description: |
        drag the image file straight into this box. github uploads it and leaves a link behind.
        png, jpeg, webp or gif, under 15mb. don't paste a link from somewhere else — i can only read github's own attachments.
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: link back to you
      description: optional. an https link — your site, your art account, wherever you'd like the credit to point. leave it blank and i'll credit your github.
      placeholder: https://
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: the small print
      options:
        - label: i coloured this myself. it isn't ai-generated and it isn't traced from someone else's work.
          required: true
        - label: i'm happy for it to sit on chelsea's github profile, credited to me.
          required: true
        - label: i understand i can ask for it to be taken down at any time, and it will be.
          required: true
