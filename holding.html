<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chelsea hopkins</title>
<meta name="description" content="chelsea hopkins draws things, builds things and writes about both. a shop, some writing, and how to get in touch.">
<link rel="canonical" href="https://chelseahopkins.co.uk/">
<meta property="og:type" content="website">
<meta property="og:title" content="chelsea hopkins">
<meta property="og:description" content="i draw things, build things and write about both.">
<meta property="og:url" content="https://chelseahopkins.co.uk/">
<meta property="og:locale" content="en_GB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-40 -40 80 80'%3E%3Cpath d='M0,-34 C3,-12 12,-3 34,0 C12,3 3,12 0,34 C-3,12 -12,3 -34,0 C-12,-3 -3,-12 0,-34 Z' fill='%23c9962e'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/fredoka-normal-400-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Fredoka";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(/fonts/fredoka-normal-400-700-latin.woff2) format("woff2");
}
@font-face {
  font-family: "Nunito";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(/fonts/nunito-normal-400-700-latin.woff2) format("woff2");
}
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(/fonts/jetbrains-mono-normal-400-latin.woff2) format("woff2");
}

:root {
  --paper: #ffffff;
  --ink: #141414;
  --ink-2: #363636;
  --muted: #6c6c6c;
  --blue: #2f4fe6;
  --yellow: #f7c948;
  --red: #e8432e;
  --gold: #c9962e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121212;
    --ink: #f2f2f2;
    --ink-2: #d6d6d6;
    --muted: #a0a0a0;
    --blue: #7c93ff;
    --yellow: #ffd75e;
    --red: #ff7a63;
    --gold: #e0b04a;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: clamp(1.25rem, 4vw, 3rem);
  background: var(--paper);
  color: var(--ink);
  font-family: "Nunito", system-ui, sans-serif;
  font-size: clamp(1.05rem, 0.98rem + 0.3vw, 1.2rem);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--yellow); color: #141414; }

main { width: 100%; max-width: 62rem; }

.star { display: block; width: 2.5rem; height: 2.5rem; margin-bottom: 1.25rem; fill: var(--gold); }

h1 {
  margin: 0;
  font-family: "Fredoka", ui-rounded, system-ui, sans-serif;
  font-weight: 600;
  font-size: clamp(2.6rem, 9vw, 5rem);
  line-height: .92;
  letter-spacing: -.02em;
}

.ask {
  margin: 2.5rem 0 1.25rem;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .78rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}

/* three ways in, the same size, side by side. none of them is the main one. */
.doors {
  list-style: none;
  margin: 0;
  padding: 0 6px 6px 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
  gap: 1.5rem;
}
.doors a {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 9.5rem;
  padding: 1.25rem 1.4rem 1.1rem;
  border: 2px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  text-decoration: none;
  box-shadow: 6px 6px 0 var(--door);
  transition: transform .15s, box-shadow .15s;
}
.doors a:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--door); }
.doors a:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
.doors b {
  font-family: "Fredoka", ui-rounded, system-ui, sans-serif;
  font-weight: 600;
  font-size: 1.6rem;
  line-height: 1.1;
  letter-spacing: -.01em;
}
.doors span { margin-top: .5rem; color: var(--ink-2); }
.doors i {
  margin-top: auto;
  padding-top: 1rem;
  font-style: normal;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .72rem;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.door-buy { --door: var(--yellow); }
.door-read { --door: var(--blue); }
.door-meet { --door: var(--red); }

.also { margin: 2.25rem 0 0; text-align: center; color: var(--ink-2); }
.also a { color: var(--blue); text-decoration-thickness: 2px; text-underline-offset: .2em; }
.also a:hover { color: var(--red); }

@media (prefers-reduced-motion: reduce) { .doors a { transition: none; } .doors a:hover { transform: none; } }
@media (max-width: 40rem) { .doors a { min-height: 0; } .ask { margin-top: 2rem; } }
</style>
</head>
<body>

<main>
  <svg class="star" viewBox="-40 -40 80 80" aria-hidden="true"><path d="M0,-34 C3,-12 12,-3 34,0 C12,3 3,12 0,34 C-3,12 -12,3 -34,0 C-12,-3 -3,-12 0,-34 Z"/></svg>
  <h1>chelsea<br>hopkins</h1>
  <p class="ask">what are you here for?</p>
  <ul class="doors">
    <!-- shop-link:<li><a class="door-buy" href="/shop/"><b>to buy something</b><span>keyrings, earrings and other small things made from my drawings.</span><i>the shop →</i></a></li> -->
    <li><a class="door-read" href="/notes/"><b>to read something</b><span>notes on the things i've built, and what went wrong.</span><i>scribblings →</i></a></li>
    <li><a class="door-meet" href="/about/"><b>to find out who i am</b><span>what i do for a living, and how to get hold of me.</span><i>hello →</i></a></li>
  </ul>
  <p class="also">or try <a href="https://whimsee.co.uk">whimsee</a>, the app i built that sends you outside.</p>
</main>

<!-- posthog (cookieless), shared with the rest of the site -->
<script src="/main.js" defer></script>
</body>
</html>
